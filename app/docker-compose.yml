services:
  db:
    image: postgres:16-alpine
    container_name: shopmarket-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopmarket}
      POSTGRES_USER: ${POSTGRES_USER:-shopmarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopmarket_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopmarket} -d ${POSTGRES_DB:-shopmarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: shopmarket-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      - DATABASE_URL=postgres://${POSTGRES_USER:-shopmarket}:${POSTGRES_PASSWORD:-shopmarket_secret}@db:5432/${POSTGRES_DB:-shopmarket}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  migrate:
    build: .
    container_name: shopmarket-migrate
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-False}
      - DATABASE_URL=postgres://${POSTGRES_USER:-shopmarket}:${POSTGRES_PASSWORD:-shopmarket_secret}@db:5432/${POSTGRES_DB:-shopmarket}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: shopmarket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume: